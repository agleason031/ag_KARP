[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ag-karp"
dynamic = ["version"]
description = "KARP: KOSMOS Astronomical Reduction Pipeline for long-slit spectra from KOSMOS (APO 3.5 m)"
readme = "README.md"
requires-python = ">=3.11"  # tomllib
authors = [{ name = "Chase L. Smith" }, { name = "Max Moe" }, { name = "Alex Gleason" }]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "ccdproc",
    "numba",
    "joblib",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
sound = ["pygame"]  # [output] sound = true
test = ["pytest"]

[project.scripts]
karp = "karp.cli:main"

[tool.setuptools]
packages = ["karp"]

[tool.setuptools.package-data]
karp = ["data/*/*"]

[tool.setuptools.dynamic]
version = { attr = "karp.__version__" }
