[build-system]
requires = ["setuptools>=77"]  # SPDX license field
build-backend = "setuptools.build_meta"

[project]
name = "ag-karp"
dynamic = ["version"]
description = "KARP: KOSMOS Astronomical Reduction Pipeline for long-slit spectra from KOSMOS (APO 3.5 m)"
readme = "README.md"
requires-python = ">=3.11"  # tomllib
license = "BSD-3-Clause"
license-files = ["LICENSE", "karp/data/extinction/LICENSE-pykosmos.txt"]
authors = [{ name = "Alex Gleason" }]
dependencies = [
    "numpy",
    "scipy",
    "astropy",
    "ccdproc",
    "numba",
    "joblib",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
sound = ["pygame"]  # [output] sound = true
test = ["pytest"]

[project.urls]
Repository = "https://github.com/agleason031/ag_KARP"

[project.scripts]
karp = "karp.cli:main"

[tool.setuptools]
packages = ["karp"]

[tool.setuptools.package-data]
karp = ["data/*/*"]

[tool.setuptools.dynamic]
version = { attr = "karp.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
