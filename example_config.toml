# KARP example configuration
#
#   python ag_KARP.py example_config.toml --list   # check which frames KARP will use
#   python ag_KARP.py example_config.toml          # reduce
#
# Only [paths] is required. Every other setting below is shown with its default
# (see config.py); delete or comment out anything you don't need to change.
# Settings that default to "not set" are shown commented out.

[paths]
raw_dir = "path/to/raw/night"      # Raw KOSMOS frames (k.NNNN.fits)
output_dir = "path/to/reductions"  # Each object goes in output_dir/<OBJNAME>/
pattern = "*.fits"                 # "**/*.fits" also searches subdirectories

[frames]
# KARP sorts frames by their headers: IMAGETYP (Bias / Flat / Object / Comp),
# OBJNAME, DISPERSR, SLIT, BINX/BINY and the lamp keywords. Science frames are
# grouped by object and setup; each group gets the biases with the same binning,
# the flats with the same setup, and the arcs with the same setup (for each lamp
# combination, the arc nearest in time plus repeats taken within an hour of it).
# Use these to narrow or override that (frame numbers are the digits at the end
# of the file name, k.0061.fits -> 61).
objects = []      # e.g. ["G093440"]; empty = every object found
science = []      # e.g. [61, 62, 63]; empty = all science frames
bias = []         # empty = automatic
flat = []         # empty = automatic (no flats found: no flat-field correction)
arc = []          # empty = automatic: per lamp combination, the arcs nearest in time
exclude = []      # frames never to use, e.g. [9]

[target]
# Coordinates for the heliocentric correction come from each frame's RA/DEC
# header, and the time from DATE-OBS (mid-exposure). Override if needed:
# ra = "23:50:59.00"
# dec = "+2:36:15.5"
site_height = 2788.0   # m; not in the headers (APO)

[steps]
reduce = true      # calibrate, trace, extract, wavelength-calibrate each frame
combine = true     # scale and combine the extracted frames (can run alone)
normalize = true   # optional: continuum-normalize the combined spectrum (can run alone)
fluxcal = true     # optional: flux-calibrate with a standard star of the same setup
                   #   (disperser, slit, binning); skipped when there is none

[detector]
# KOSMOS at 2x1 binning. Column ranges are 0-based and end-exclusive, one per amplifier.
amp_data = [[0, 512], [512, 1024]]
amp_overscan = [[1034, 1074], [1084, 1124]]
gain = [0.6, 0.6]       # e-/DN (spec sheet)
readnoise = 5.7         # e-
full_well = 150000.0    # e-
overscan_order = 3

[flat]
# The grating's zeroth order crosses the slit as a bright band in the flat-lamp frames;
# the final flat is set to 1 in those rows so the band doesn't print into the science frames.
zeroth_order = "auto"    # "auto", "none", or [[row_min, row_max], ...] (inclusive)
zeroth_threshold = 0.02  # "auto": bands at least this much (fraction) above the running median
zeroth_pad = 10          # "auto": rows added on each side of a band

[trace]
order = 3      # polynomial order of the trace
# col = 480    # starting column for the trace search (default: brightest column)

[extraction]
aperture = 20     # full aperture width, pixels
buffer = 20       # gap between aperture and background, pixels per side
background = 25   # background region width, pixels per side
method = "optimal" # "optimal" (Horne 1986) or "boxcar"
sky_order = 1      # polynomial order of the sky fit across the slit
profile_window = 101 # rows over which the spatial profile is smoothed (optimal)
reject_sigma = 5.0 # optimal: leave out pixels deviating by more than this

[cosmic_rays]
enabled = true
sigclip = 4.5

[normalization]
# Optional step (steps.normalize): fit a continuum to the combined spectrum and divide
# by it. The continuum is a cubic spline, fit while leaving out pixels far below it
# (absorption) or above it (emission, cosmic rays), and the masked regions.
knot_spacing = 150.0   # A between spline knots; larger than the widest masked region
low_reject = 2.0       # leave out pixels more than this many sigma below the continuum
high_reject = 3.0      # ... or above it
mask = "default"       # "default" (calib_data/masks/stellar.txt), "none", or a file: center, half-width (A)
extra_mask = []        # more regions to leave out, e.g. [[5500, 5700]]
# clip = 1.25          # flag (Mask bit 1) normalized flux above this
clip_regions = []      # e.g. [[5500, 5700, 1.05]] to flag the zeroth order

[fluxcal]
# Optional step (steps.fluxcal). A spectrophotometric standard observed with the same
# setup gives the sensitivity function (count rate / tabulated flux, corrected for
# extinction and fit with a spline), applied to every object with that setup; writes
# OUT/<obj>_fluxed.fits (erg/s/cm2/A) and the standard's OUT/<std>_sensfunc.fits.
# The shape is reliable; the absolute level depends on slit losses and transparency.
standard = "auto"      # "auto": recognize standards by OBJNAME (calib_data/standards/index.json),
                       #   or the OBJNAME of the object to use as the standard
# reference = "my_star.txt"  # tabulated flux (air A, erg/s/cm2/A) for a standard not in the library
extinction = "apo"     # "apo" (calib_data/extinction/apo.txt) or a file: wavelength (A), mag/airmass
knot_spacing = 250.0   # A between spline knots
clip_sigma = 3.0
mask = "default"       # "default" (calib_data/masks/standard.txt), "none", or a file: center, half-width (A)
extra_mask = []        # more regions to leave out, e.g. [[5500, 5700]]
resolution = 0.0       # KOSMOS FWHM (A) for comparing the standard with its tabulated flux at
                       #   matched resolution; 0 = arc line width (the result depends little on it)
fit_offset = true      # fit a wavelength offset between the standard and its tabulated spectrum
max_offset = 5.0       # A, largest offset searched
max_extrapolate = 100.0  # A the sensitivity is extended linearly past the fitted range (Mask bit 8)

[combine]
# Frames are scaled to the one with the best S/N, then combined pixel by pixel.
scale = "smooth"   # "smooth" (polynomial in wavelength), "median" (one factor), or "none"
scale_order = 2
method = "weighted"  # "weighted": inverse-variance mean after rejecting outliers (Mask bit 4
                     #   marks pixels where a frame was rejected); "mean": plain mean; "median"
reject_sigma = 5.0   # "weighted": reject values this many sigma from the frames' median
                     #   (only where >= 3 frames have data); 0 = no rejection
jackknife = false  # also report S/N with each frame left out

[wavecal]
# Arc lines are found and identified automatically, starting from a rough solution
# for the grating in calib_data/wavecal/kosmos_<disperser>.json. Each run writes
# OUT/<object>_wavecal_<n>.txt with every matched line and its residual.
order = "auto"     # polynomial order, or "auto" (best leave-one-out accuracy, orders 2-6)
lamps = []         # line lists, e.g. ["ARGON", "NEON"]; empty = lamps on in the arc header
# reference = "calib_data/wavecal/kosmos_blue.json"   # default: by disperser
search = 200       # largest shift (rows) between the reference and the arc
match_tol = 3.0    # rows
clip_sigma = 3.0
min_lines = 8
max_rms = 15.0     # km/s; a worse solution stops with an error
peak_sigma = 5.0   # arc line detection threshold, times the noise
flexure = "report" # night-sky line check: "off", "report", or "correct"
sky_lines = [5577.338, 6300.304, 6363.776]

[output]
verbose = false
sound = false   # play a short tone when KARP finishes
