# Regression configuration for the G093440 test set (KOSMOS, blue grating,
# 0.87" slit, 2x1 binning, 2024-09-29). regress.py fills in the paths.
# Settings that match the defaults in config.py are written out anyway, so a
# change of default doesn't silently change the reference.

[paths]
raw_dir = "test_data/in"
output_dir = "tests/regression/runs/unset"

[steps]
reduce = true
combine = true
normalize = true

[detector]
amp_data = [[0, 512], [512, 1024]]
amp_overscan = [[1034, 1074], [1084, 1124]]
gain = [0.6, 0.6]
readnoise = 5.7
full_well = 150000
overscan_order = 3

[trace]
order = 3

[extraction]
aperture = 20
buffer = 20
background = 25
method = "optimal"
sky_order = 1
profile_window = 101
reject_sigma = 5.0

[cosmic_rays]
enabled = true
sigclip = 4.5

[normalization]
knot_spacing = 150.0
low_reject = 2.0
high_reject = 3.0
mask = "default"
extra_mask = []
clip_regions = []

[combine]
scale = "smooth"
scale_order = 2
method = "weighted"
reject_sigma = 5.0
jackknife = false

[wavecal]
order = "auto"
search = 200
match_tol = 3.0
clip_sigma = 3.0
min_lines = 8
max_rms = 15.0
peak_sigma = 5.0
flexure = "report"
sky_lines = [5577.338, 6300.304, 6363.776]

[output]
verbose = false
sound = false
